name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the tag matches build.sh's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(./build.sh --print-version)"
          if [ "$TAG" != "v$version" ]; then
            echo "The tag $TAG doesn't match build.sh's version, so it should be v$version." >&2
            exit 1
          fi
      - run: ./test.sh
      - run: ./build.sh --zip
      - name: Take the release notes from CHANGELOG.md
        run: |
          version="$(./build.sh --print-version)"
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > build/notes.md
          if ! grep -q '[^[:space:]]' build/notes.md; then
            echo "CHANGELOG.md has no ## $version section." >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(./build.sh --print-version)"
          gh release create "$TAG" "build/Pin-on-Top-$version.zip" "build/Pin-on-Top-$version.zip.sha256" \
            --title "Pin on Top $version" --notes-file build/notes.md
